name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev qt6-wayland-dev libwayland-dev \
            xvfb grim dbus pkg-config qt6-wayland-dev-tools
          for p in qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
                   qml6-module-qtquick-window qml6-module-qtquick-shapes qml6-module-qtquick-layouts \
                   qml6-module-qtqml-workerscript qml6-module-qtwaylandcompositor; do
            if apt-cache show "$p" >/dev/null 2>&1; then
              sudo apt-get install -y "$p"
            else
              echo "skip missing $p"
            fi
          done
          test -x /usr/lib/qt6/bin/qtwaylandscanner || sudo apt-get install -y qt6-wayland-dev-tools
          /usr/lib/qt6/bin/qtwaylandscanner --version || true
          ls /usr/lib/qt6/qml/QtWayland 2>/dev/null || true

      - name: lint
        continue-on-error: true
        run: |
          sudo apt-get install -y qt6-declarative-dev-tools || true
          (qmllint qml/*.qml || /usr/lib/qt6/bin/qmllint qml/*.qml) || true

      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build

      - name: shots
        continue-on-error: true
        run: ./scripts/ci_shots.sh

      - name: upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/shots/*.png
