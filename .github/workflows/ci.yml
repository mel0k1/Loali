name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev qt6-wayland-dev libwayland-dev \
            xvfb grim dbus pkg-config qt6-wayland-dev-tools libgl1-mesa-dri libegl-mesa0 mesa-utils
          for p in qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
                   qml6-module-qtquick-window qml6-module-qtquick-shapes qml6-module-qtquick-layouts \
                   qml6-module-qtqml-workerscript qml6-module-qtwayland-compositor; do
            if apt-cache show "$p" >/dev/null 2>&1; then
              sudo apt-get install -y "$p"
            else
              echo "skip missing $p"
            fi
          done
          for p in $(apt-cache pkgnames qml6-module-qtwayland); do
            sudo apt-get install -y "$p" || true
          done
          test -x /usr/lib/qt6/bin/qtwaylandscanner || test -x /usr/lib/qt6/libexec/qtwaylandscanner || true
          dpkg -L qml6-module-qtwayland-compositor | grep -m1 "QtWayland/Compositor$" || { echo "FATAL: QtWayland.Compositor QML missing"; exit 1; }

      - name: lint
        continue-on-error: true
        run: |
          sudo apt-get install -y qt6-declarative-dev-tools || true
          (/usr/lib/qt6/bin/qmllint -I /usr/lib/x86_64-linux-gnu/qt6/qml qml/*.qml || qmllint -I /usr/lib/x86_64-linux-gnu/qt6/qml qml/*.qml) || true

      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build

      - name: shots
        continue-on-error: true
        run: sh scripts/ci_shots.sh

      - name: upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/shots/*.png
