name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev qt6-wayland-dev libwayland-dev \
            xvfb grim dbus pkg-config qt6-wayland-dev-tools libgl1-mesa-dri libegl-mesa0 mesa-utils libqt6svg6 \
            fonts-noto-core libxcb1-dev libxcb-composite0-dev xwayland x11-apps wl-clipboard \
            libpipewire-0.3-dev libspa-0.2-dev pipewire libxkbcommon-dev python3-dbus \
            foot xdotool binutils
          for p in qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
                   qml6-module-qtquick-window qml6-module-qtquick-shapes qml6-module-qtquick-layouts \
                   qml6-module-qtqml-workerscript qml6-module-qtwayland-compositor; do
            if apt-cache show "$p" >/dev/null 2>&1; then
              sudo apt-get install -y "$p"
            else
              echo "skip missing $p"
            fi
          done
          for p in $(apt-cache pkgnames qml6-module-qtwayland); do
            sudo apt-get install -y "$p" || true
          done
          test -x /usr/lib/qt6/bin/qtwaylandscanner || test -x /usr/lib/qt6/libexec/qtwaylandscanner || true
          dpkg -L qml6-module-qtwayland-compositor | grep -m1 "QtWayland/Compositor$" || { echo "FATAL: QtWayland.Compositor QML missing"; exit 1; }

      - name: lint
        continue-on-error: true
        run: |
          sudo apt-get install -y qt6-declarative-dev-tools || true
          (/usr/lib/qt6/bin/qmllint -I /usr/lib/x86_64-linux-gnu/qt6/qml qml/*.qml || qmllint -I /usr/lib/x86_64-linux-gnu/qt6/qml qml/*.qml) || true

      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build

      - name: bump wl_seat/ddm versions in prebuilt Qt (foot needs seat>=5, ddm>=3)
        run: sudo python3 scripts/qt_seat_bump.py

      - name: shots
        run: sh scripts/ci_shots.sh

      - name: upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/shots/*.png

  newqt:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:25.10
      options: --privileged
    steps:
      - name: bootstrap
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ca-certificates gdb binutils \
            qt6-base-dev qt6-declarative-dev qt6-wayland qt6-wayland-dev qt6-wayland-dev-tools \
            libwayland-dev xvfb xfonts-base grim \
            libgl1-mesa-dri libegl-mesa0 mesa-utils fonts-noto-core \
            libxcb1-dev libxcb-composite0-dev xwayland x11-apps wl-clipboard \
            libpipewire-0.3-dev libspa-0.2-dev pipewire libxkbcommon-dev python3-dbus \
            foot xdotool
          apt-get install -y --no-install-recommends dbus dbus-bin || apt-get install -y --no-install-recommends dbus-bin
          apt-get install -y --no-install-recommends libqt6svg6 || apt-get install -y --no-install-recommends libqt6svg6t64 || apt-get install -y --no-install-recommends qt6-svg || echo "svg plugin skipped"
          for p in qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
                   qml6-module-qtquick-window qml6-module-qtquick-shapes qml6-module-qtquick-layouts \
                   qml6-module-qtqml-workerscript qml6-module-qtwayland-compositor; do
            apt-get install -y "$p" || echo "skip missing $p"
          done
          for p in $(apt-cache pkgnames qml6-module-qtwayland); do
            apt-get install -y "$p" || true
          done
          qmake6 --version || true

      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build

      - name: bump wl_seat/ddm versions in prebuilt Qt (skip if Qt already newer)
        run: |
          python3 scripts/qt_seat_bump.py || echo "seat bump: pattern not found, Qt may already advertise seat>=5"

      - name: grim shots
        env:
          SHOT_TOOL: grim
        run: sh scripts/ci_shots.sh

      - name: upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-grim
          path: build/shots/
          if-no-files-found: warn
